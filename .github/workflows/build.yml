name: Build & Publish Dislocker Termux APT Repo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apt-repo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/infiniti151/dislocker-android-builder:latest
      options: --user root --shm-size=2gb

    permissions:
      contents: write
      attestations: write
      id-token: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore existing APT repository
        run: |
          set -eu

          mkdir -p output/apt-repo

          if git fetch origin apt-repo:refs/remotes/origin/apt-repo; then
            echo "Restoring existing APT repository..."

            git archive origin/apt-repo \
              | tar -x -C output/apt-repo
          else
            echo "No apt-repo branch exists yet."
            echo "Starting with an empty APT repository."
          fi

          echo "=== Restored APT repository ==="
          find output/apt-repo -type f -print | sort || true

      - name: Import GPG signing key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Build package and APT repository
        env:
          GPG_KEY: ${{ steps.import-gpg.outputs.keyid }}
          GPG_PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          set -eu

          chmod +x ./build-dislocker.sh
          ./build-dislocker.sh

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.DEB_FILE }}

      - name: Upload APT repository
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: output/apt-repo

      - name: Update apt-repo branch
        run: |
          set -eu

          APT_WORKTREE="/tmp/apt-repo"

          rm -rf "$APT_WORKTREE"

          if git fetch origin apt-repo:refs/remotes/origin/apt-repo; then
            echo "Checking out existing apt-repo branch..."

            git worktree add \
              "$APT_WORKTREE" \
              origin/apt-repo
          else
            echo "Creating new apt-repo branch..."

            git worktree add --detach "$APT_WORKTREE"

            cd "$APT_WORKTREE"

            git checkout --orphan apt-repo
            git rm -rf . 2>/dev/null || true
          fi

          cd "$APT_WORKTREE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "=== Replacing repository contents ==="

          find "$APT_WORKTREE" \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

          cp -a \
            "$GITHUB_WORKSPACE/output/apt-repo/." \
            "$APT_WORKTREE/"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to apt-repo branch."
            exit 0
          fi

          git commit \
            -m "Update APT repository for ${GITHUB_REF_NAME}"

          git push origin HEAD:apt-repo

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
